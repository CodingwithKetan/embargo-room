<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Security Desk</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#eef0f4; --surface:#fff; --surface-2:#f5f6f9; --fg:#191c23; --muted:#5a6471; --faint:#8a94a3;
    --border:#e0e4ea; --border-strong:#cdd3dd; --accent:#3b5bdb; --accent-soft:#e7ebfb;
    --crit:#d13b3b; --crit-soft:#fbe6e6; --good:#2b8a3e; --good-soft:#e4f3e7; --warn:#b8860b; --warn-soft:#f6eed6;
    --shadow:0 1px 2px rgba(20,26,40,.05),0 2px 10px rgba(20,26,40,.04);
    --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace; --sans:"IBM Plex Sans",system-ui,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0d1016; --surface:#151a22; --surface-2:#1b212b; --fg:#e7ebf2; --muted:#9aa4b3; --faint:#6b7686;
    --border:#242b36; --border-strong:#333c49; --accent:#8ea2ff; --accent-soft:#1c2440;
    --crit:#ff6b6b; --crit-soft:#35191b; --good:#5bc46b; --good-soft:#15291a; --warn:#e3b341; --warn-soft:#2e2510;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 12px rgba(0,0,0,.28); color-scheme:dark;}}
  :root[data-theme="dark"]{
    --bg:#0d1016; --surface:#151a22; --surface-2:#1b212b; --fg:#e7ebf2; --muted:#9aa4b3; --faint:#6b7686;
    --border:#242b36; --border-strong:#333c49; --accent:#8ea2ff; --accent-soft:#1c2440;
    --crit:#ff6b6b; --crit-soft:#35191b; --good:#5bc46b; --good-soft:#15291a; --warn:#e3b341; --warn-soft:#2e2510;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 12px rgba(0,0,0,.28); color-scheme:dark;}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);line-height:1.5}
  .wrap{max-width:1120px;margin:0 auto;padding:24px 16px 64px}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  h1,h2{margin:0;line-height:1.2}
  .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:600}
  header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;padding-bottom:16px;border-bottom:1px solid var(--border)}
  h1{font-size:23px;font-weight:700;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:13px;margin-top:3px}
  a.link,button{font-family:var(--mono);font-size:12px;color:var(--fg);background:var(--surface);border:1px solid var(--border-strong);border-radius:8px;padding:7px 10px;cursor:pointer;text-decoration:none}
  a.link:hover,button:hover{border-color:var(--accent)}

  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:18px 0}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 15px;box-shadow:var(--shadow)}
  .kpi .v{font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:-.02em}
  .kpi .v.good{color:var(--good)} .kpi .v.crit{color:var(--crit)}
  .kpi .k{font-size:11.5px;color:var(--muted);margin-top:2px}

  .panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
  .panel>.h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:13px 16px;border-bottom:1px solid var(--border)}
  .panel>.h h2{font-size:14px} .panel>.h .note{font-size:12px;color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  td,th{text-align:left;padding:10px 16px;border-bottom:1px solid var(--border)} tr:last-child td{border-bottom:0}
  th{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  .pill{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px}
  .pill.pub{color:var(--good);background:var(--good-soft)} .pill.sla{color:var(--good);background:var(--good-soft)}
  .pill.open{color:var(--warn);background:var(--warn-soft)} .pill.res{color:var(--good);background:var(--good-soft)}
  .radar{padding:14px 16px;font-size:13.5px} .radar .tags{margin:6px 0 10px}
  .tag{display:inline-block;font-family:var(--mono);font-size:12px;padding:3px 9px;border-radius:7px;background:var(--accent-soft);color:var(--accent);margin:0 6px 6px 0}
  .pol{color:var(--muted);font-size:12.5px}
  .foot{margin-top:14px;color:var(--faint);font-size:11.5px;font-family:var(--mono);text-align:center}
  @media (max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}}
</style>

<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Embargo Room</div>
      <h1>Security Desk</h1>
      <div class="sub">One disclosure program across monitoring → active disclosures → downstream coordination.</div>
    </div>
    <div style="display:flex;gap:8px">
      <a class="link" href="/ops">▶ ops replay</a>
      <a class="link" href="/">← activity dashboard</a>
      <button id="theme">◐</button>
    </div>
  </header>

  <div class="kpis" id="kpis"></div>
  <div class="panel" id="disc"></div>
  <div class="panel" id="down"></div>
  <div class="panel" id="radar"></div>
  <div class="foot">Aggregated from record/*.record.json, downstream/state.json and watch/watch-config.json — nothing hand-maintained.</div>
</div>

<script>
  const $=(id)=>document.getElementById(id);
  const esc=(s)=>String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

  async function load(){
    const p = await fetch("/api/portfolio").then(r=>r.json());
    const s = p.summary;
    $("kpis").innerHTML =
      kpi(`${s.published}/${s.disclosures}`, "disclosures published") +
      kpi(s.slaAdherence!=null?s.slaAdherence+"%":"—", "SLA adherence", s.slaAdherence===100?"good":"") +
      kpi(`$${s.programCost.toFixed(2)}`, "program cost (est.)") +
      kpi(`${s.downstreamsResolved}/${s.downstreams}`, "downstreams resolved") +
      kpi(s.monitored, "packages monitored");

    $("disc").innerHTML = `<div class="h"><h2>Active / closed disclosures</h2><span class="note">${s.overdue} overdue</span></div>`
      + `<table><thead><tr><th>Advisory</th><th>Status</th><th>Grade</th><th>Cycle time</th><th>Caught</th><th>Cost</th></tr></thead><tbody>`
      + p.disclosures.map(d=>`<tr><td class="mono">${esc(d.cve||d.room)}</td>`
        + `<td><span class="pill pub">${esc(d.status)}</span></td>`
        + `<td><span class="pill sla">${esc(d.grade)}</span></td>`
        + `<td class="mono">${esc(d.cycleTime)}</td>`
        + `<td class="mono">${d.incompleteFixes}${d.incompleteFixes?" ✓":""}</td>`
        + `<td class="mono">$${d.cost.toFixed(2)}</td></tr>`).join("")
      + `</tbody></table>`;

    $("down").innerHTML = `<div class="h"><h2>Downstream coordination</h2><span class="note">deadline ${esc((s.deadline||"").slice(0,10))}</span></div>`
      + `<table><thead><tr><th>Dependent</th><th>Status</th><th>Resolved</th><th>To deadline</th></tr></thead><tbody>`
      + p.downstreams.map(d=>`<tr><td class="mono">${esc(d.package)}</td><td>${esc(d.status)}</td>`
        + `<td><span class="pill ${d.resolved?"res":"open"}">${d.resolved?"resolved":"open"}</span></td>`
        + `<td class="mono">${d.daysToDeadline!=null?d.daysToDeadline+"d":"—"}</td></tr>`).join("")
      + `</tbody></table>`;

    const pol=p.monitoring.policy||{};
    $("radar").innerHTML = `<div class="h"><h2>Monitoring radar</h2><span class="note">${esc(p.monitoring.ecosystem||"npm")} · auto-mode, human-gated</span></div>`
      + `<div class="radar"><div class="tags">${(p.monitoring.watchlist||[]).map(w=>`<span class="tag">${esc(w)}</span>`).join("")}</div>`
      + `<div class="pol">On new CVE → <b>${esc(pol.on_new_cve||"—")}</b> · open a room needs a human: <b>${pol.require_human_to_open_room}</b> · build/run needs a human: <b>${pol.require_human_to_build}</b></div>`
      + `<div class="pol" style="margin-top:6px">Autonomous discovery, human-gated action — the agent proposes, a human approves.</div></div>`;
  }
  function kpi(v,k,cls){ return `<div class="kpi"><div class="v ${cls||""}">${esc(v)}</div><div class="k">${esc(k)}</div></div>`; }

  $("theme").addEventListener("click",()=>{const r=document.documentElement,c=r.getAttribute("data-theme");r.setAttribute("data-theme",c==="dark"?"light":"dark");});
  load();
</script>
