<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Embargo Captions</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  /* Lower-third caption cards for the demo video. Each .lt is a broadcast-style
     lower-third you screenshot (or snip) and drop over your footage. The toolbar
     is not part of a card — switch the backdrop to match how you'll composite:
     dark (burn-in), green (chroma key), or checker (shows the transparent area). */
  :root{
    --sans:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --accent:#8ea2ff; --critical:#ff6b6b; --good:#5bc46b; --watch:#e3b341;
    --ink:#f3f6fc; --ink-dim:#aeb8c9;
    --panel:rgba(16,20,28,.82);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:var(--sans); background:#0d1016; color:var(--ink);
    padding:0 0 80px;}
  body[data-bg="green"]{background:#00b140}
  body[data-bg="checker"]{
    background:
      linear-gradient(45deg,#2a2f3a 25%,transparent 25%),
      linear-gradient(-45deg,#2a2f3a 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#2a2f3a 75%),
      linear-gradient(-45deg,transparent 75%,#2a2f3a 75%);
    background-size:28px 28px; background-position:0 0,0 14px,14px -14px,-14px 0; background-color:#1b2028;}

  /* toolbar (not captured) */
  .bar{position:sticky; top:0; z-index:9; display:flex; flex-wrap:wrap; gap:10px; align-items:center;
    padding:12px 18px; background:#11151d; border-bottom:1px solid #242b36;}
  .bar h1{font-size:14px; margin:0 12px 0 0; font-weight:600; letter-spacing:-.01em}
  .bar .hint{font-size:12px; color:var(--ink-dim); font-family:var(--mono)}
  .bar button{font-family:var(--mono); font-size:12px; color:var(--ink-dim); background:#1b212b;
    border:1px solid #333c49; border-radius:7px; padding:6px 11px; cursor:pointer}
  .bar button:hover{color:#fff; border-color:var(--accent)}
  .bar button[aria-pressed="true"]{color:#fff; border-color:var(--accent); background:#1c2440}

  .stage{display:flex; flex-direction:column; align-items:center; gap:30px; padding:30px 18px 0}

  /* a 16:9 safe-frame so you can see where the lower-third sits in frame */
  .frame{width:min(960px,100%); aspect-ratio:16/9; position:relative;
    border:1px dashed #3a4350; border-radius:10px; overflow:hidden;}
  body[data-bg="green"] .frame,
  body[data-bg="checker"] .frame{border-color:rgba(255,255,255,.35)}
  .frame .tag{position:absolute; top:8px; left:10px; font-family:var(--mono); font-size:11px;
    color:var(--ink-dim); letter-spacing:.04em}

  /* the lower-third itself, anchored bottom-left like broadcast */
  .lt{position:absolute; left:4.5%; right:4.5%; bottom:7%;
    display:flex; align-items:stretch; gap:0; border-radius:12px; overflow:hidden;
    background:var(--panel); backdrop-filter:blur(6px);
    box-shadow:0 10px 34px rgba(0,0,0,.42), 0 1px 0 rgba(255,255,255,.05) inset;}
  .lt .accent{width:7px; flex:none; background:var(--accent)}
  .lt .body{padding:15px 20px 16px; min-width:0}
  .lt .eyebrow{font-family:var(--mono); font-size:12px; font-weight:600; letter-spacing:.13em;
    text-transform:uppercase; color:var(--accent); display:flex; gap:10px; align-items:center}
  .lt .eyebrow .tc{color:var(--ink-dim)}
  .lt .cap{font-size:25px; line-height:1.22; font-weight:600; letter-spacing:-.01em; margin-top:6px; text-wrap:balance}
  .lt .cap .mono{font-family:var(--mono); font-weight:600}
  .lt .cap em{font-style:normal; color:var(--accent)}
  .lt .cap b{font-weight:700}

  /* semantic variants */
  .lt.crit .accent{background:var(--critical)} .lt.crit .eyebrow{color:var(--critical)} .lt.crit .cap em{color:var(--critical)}
  .lt.good .accent{background:var(--good)}     .lt.good .eyebrow{color:var(--good)}     .lt.good .cap em{color:var(--good)}
  .lt.watch .accent{background:var(--watch)}   .lt.watch .eyebrow{color:var(--watch)}   .lt.watch .cap em{color:var(--watch)}

  /* end card is centered, bigger */
  .lt.end{left:14%; right:14%; bottom:30%; background:rgba(16,20,28,.9)}
  .lt.end .cap{font-size:30px}
  .lt.end .sub{color:var(--ink-dim); font-size:15px; margin-top:8px; font-family:var(--mono)}

  .lbl{font-family:var(--mono); font-size:12px; color:var(--ink-dim); margin:-14px 0 -8px}
  @media (max-width:640px){ .lt .cap{font-size:19px} .lt.end .cap{font-size:22px} }
</style>

<div class="bar">
  <h1>Lower-third captions</h1>
  <span class="hint">backdrop:</span>
  <button data-set="dark" aria-pressed="true">dark (burn-in)</button>
  <button data-set="green">green screen</button>
  <button data-set="checker">transparent</button>
  <span class="hint" style="margin-left:auto">snip each card · 16:9 frame shows placement</span>
</div>

<div class="stage" id="stage"></div>

<script>
  // One row per beat: [variant, beat label, timecode, caption HTML]
  const beats = [
    ["", "Beat 1", "0:00", 'Coordinated disclosure, in <b>one Switch room</b> — 2 humans, 3 agents'],
    ["", "Beat 2", "0:22", 'Researcher files a report → the <b>Timekeeper</b> opens the embargo'],
    ["crit", "Beat 3", "0:38", 'Repro agent runs the PoC in Docker → <em>TRIGGERED</em>'],
    ["crit", "Beat 4 · the catch", "0:55", "Vendor's real commit <span class='mono'>v1.2.5</span>, built from source → <em>STILL TRIGGERED</em> · advance refused"],
    ["good", "Beat 5", "1:28", "<span class='mono'>v1.2.6</span> → <em>SAFE</em> · OSV agrees · two human sign-offs → <em>PUBLISHED</em>"],
    ["", "Beat 6 · defense", "1:58", 'Red-team: <b>5 / 5 attacks BLOCKED</b>'],
    ["", "Beat 7", "2:24", 'Hash-chained record · tamper caught · <b>3/3 verdicts attested</b>'],
    ["good", "Beat 8", "2:46", "Emits OSV / CVE 5.0 / GHSA — <em>VALIDATED</em> · <span class='mono'>npm test</span> <b>17/17</b>"],
    ["", "Beat 9", "3:02", 'Bridge-agnostic failover · <b>the record is portable</b>'],
    ["end", "End card", "", "Embargo Room<div class='sub'>disclosure as a Switch room · Flip the Switch · Track 1</div>"],
  ];
  const stage = document.getElementById('stage');
  beats.forEach(([v,label,tc,cap])=>{
    const wrap = document.createElement('div');
    wrap.innerHTML =
      `<div class="lbl">${label}${tc?` · ${tc}`:""}</div>`+
      `<div class="frame"><span class="tag">16:9 frame — ${label}</span>`+
        `<div class="lt ${v}">`+
          (v==="end"?"":`<div class="accent"></div>`)+
          `<div class="body">`+
            (v==="end"?"":`<div class="eyebrow">${label}<span class="tc">${tc}</span></div>`)+
            `<div class="cap">${cap}</div>`+
          `</div>`+
        `</div>`+
      `</div>`;
    stage.appendChild(wrap);
  });
  // backdrop switch
  document.querySelectorAll('.bar button').forEach(b=>{
    b.addEventListener('click',()=>{
      document.querySelectorAll('.bar button').forEach(x=>x.setAttribute('aria-pressed','false'));
      b.setAttribute('aria-pressed','true');
      const v=b.dataset.set;
      document.body.setAttribute('data-bg', v==="dark"?"":v);
    });
  });
</script>
