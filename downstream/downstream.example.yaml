# Downstream coordination manifest for the minimist disclosure.
# Each entry gets its own child room; the parent room aggregates their status.
target: minimist
parent_room: embargo-minimist-demo
downstreams:
  - package: rc
    repo: https://github.com/dominictarr/rc
    maintainer: "{rc-handle}"
    status: pending        # pending | notified | patched | wont-fix | unreachable
  - package: subarg
    repo: https://github.com/substack/subarg
    maintainer: "{subarg-handle}"
    status: pending
  - package: optimist
    repo: https://github.com/substack/node-optimist
    maintainer: "{optimist-handle}"
    status: pending
