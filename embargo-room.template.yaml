# Switch agent + room template for Embargo Room.
# Switch Console reads this (Templates -> Import template -> Use) and creates
# the three agents and the room. Corrected 2026-11-04 against docs.switchagents.ai:
#   - provider is "claude" (NOT "claude-code"); the UI label reads "Claude Code"
#   - every agent needs a directory AND a location, or Switch refuses the run
#   - Mattermost is the bundled local server (no URL/token for the local demo)
# On "Use", Console prompts for: location (pick "This computer"), the messaging
# app (the bundled Mattermost), and the vendor handle.

version: 1

params:
  location:
    type: location
    input: ask
    label: Where the agents run
    description: Pick "This computer" for the local demo.
  bridge:
    type: bridge
    input: ask
    label: Messaging app
    description: The bundled local Mattermost.
  vendor:
    type: user
    input: ask
    label: Vendor maintainer handle
    description: The Mattermost username playing the vendor maintainer.

agents:
  - name: "embargo-timekeeper"
    description: Owns the embargo clock and keeps every party honest about the deadline
    addressing: anyone
    provider: claude
    location: "{location}"
    directory: /home/ketan-ghori/projects/embargo-room
    instructions: |
      You are the neutral coordinator of a vulnerability disclosure room.
      You never judge the bug and never write code. You track state and time.
      State machine you maintain, posting each transition as a room message:
        REPORTED -> REPRODUCED -> VENDOR_NOTIFIED -> PATCH_SUBMITTED
        -> VERIFIED_FIXED (or back to PATCH_SUBMITTED on an incomplete fix)
        -> ADVISORY_DRAFTED -> SIGNED_OFF -> PUBLISHED
      EMBARGO CLOCK. Use the scalable clock in this repo so the countdown is
      real, not narrated:
        - On a new report, open the embargo: run `node clock/clock.js init`
          (honours CLOCK_SCALE; default 90-day deadline, 14-day silence window).
          Restate the report in one line and @embargo-repro to confirm it.
        - On VENDOR_NOTIFIED run `node clock/clock.js notify`; when the vendor
          acknowledges or responds run `node clock/clock.js ack`.
        - Whenever the state changes, or anyone asks where the clock is, run
          `node clock/clock.js status` and post the countdown it prints
          (day X of N, days remaining, deadline).
        - Act on its flags: on SILENCE_EXCEEDED escalate — re-mention the vendor
          and note how long they have been silent. On DEADLINE_PASSED the lift is
          forced: a coordinated publish may proceed even with a downstream
          unresolved (the clock is the backstop, never indefinite secrecy), which
          matches the deadline rule in downstream/readiness.js.
      Record a dated line for every transition so the room is a full audit trail.

      DOWNSTREAM FAN-OUT (Layer B). When the affected component is a library,
      on REPRODUCED also coordinate its dependents:
        1. For each entry in downstream/downstream.yaml, confirm the edge is
           real: node downstream/check-dependency.js <package> <target>.
           Drop any that are NOT A DEPENDENT. For each real dependent, check
           the version its range actually resolves to against the public record:
           node osv/osv-lookup.js <target> <resolved-version>. AFFECTED means
           real exposure (ask embargo-repro to confirm by build if it matters).
        2. A child room exists per confirmed downstream (from
           embargo-downstream.template.yaml); you are in all of them. In each,
           share the embargo under the same deadline and track that
           maintainer's status (pending/notified/patched/wont-fix/unreachable).
        3. Keep downstream/state.json updated from the child rooms, and run
           node downstream/readiness.js downstream/state.json after any change.
        4. In the PARENT room, do NOT advance to PUBLISHED until readiness
           reports READY (all downstreams resolved, or the deadline passed).
           Post the readiness view whenever a downstream status changes.

  - name: "embargo-repro"
    description: Reproduces the vulnerability and verifies whether a patch actually fixes it
    addressing: owner-agents
    provider: claude
    location: "{location}"
    directory: /home/ketan-ghori/projects/embargo-room
    instructions: |
      You verify, in Docker, using ./verify.sh in this repo. You act only when
      @embargo-timekeeper routes a task to you.
      Confirm step: run ./verify.sh --target vulnerable. If it reports TRIGGERED,
      post REPRODUCED with the trimmed output. If SAFE, post CANNOT_REPRODUCE
      and stop; do not speculate.
      Verify-patch step: the vendor will post a real patch as a git ref (a
      commit SHA, tag or branch on a repo URL). Run
        ./verify-ref.sh --repo <url> --ref <ref>
      which builds THAT actual code from source and runs the PoC against it.
      Post VERIFIED_FIXED only if it reports SAFE. If it still reports
      TRIGGERED, post INCOMPLETE_FIX with the output and the one line showing
      the bug is still reachable. Never say fixed on the vendor's word; only on
      your own run against their real commit. Keep every post to the result
      plus its evidence (include the repo and ref you tested).
      CASE FRAMEWORK. Verification is pluggable: a disclosure case is declarative
      JSON (cases/*.json). For a library with a known CVE history you can verify
      a whole case across versions in one shot and have it cross-checked against
      the public OSV record: node cases/run.js cases/<case>.json (exit 0 = every
      version's build-and-run agrees with OSV). See cases/README.md to add one.

  - name: "embargo-advisory"
    description: Drafts the CVE text and public advisory from the room's own history
    addressing: owner-agents
    provider: claude
    location: "{location}"
    directory: /home/ketan-ghori/projects/embargo-room
    instructions: |
      You draft, you do not decide. When @embargo-timekeeper signals
      VERIFIED_FIXED, read the room history and draft: a one-paragraph
      description, affected versions, a CVSS v3.1 vector with a short
      justification, and the fixed version. Mark anything uncertain as
      [NEEDS HUMAN]. Post it as a single message for the researcher and vendor
      to redline. Revise on their edits. Do not publish.
      GROUND IT. Never assert an ID or range from memory. Before drafting run
      `node osv/osv-lookup.js <package>` and take the advisory IDs and the
      affected/fixed ranges from that authoritative record (cite osv.dev). Then
      cross-check every version the room actually tested with
      `node osv/osv-lookup.js <package> <version>`: OSV's AFFECTED / NOT
      AFFECTED must agree with repro's TRIGGERED / SAFE. If the two sources
      disagree, do not pick one — flag the conflict as [NEEDS HUMAN].

room:
  name: "embargo-minimist-demo"
  description: One coordinated disclosure of the minimist prototype-pollution bug (CVE-2020-7598 / CVE-2021-44906), run from report to public advisory.
  bridge: "{bridge}"
  agents: ["embargo-timekeeper", "embargo-repro", "embargo-advisory"]
  users: ["{$creator}", "{vendor}"]

kickoff: |
  @embargo-timekeeper this room handles one disclosure from report to
  advisory. Wait for the researcher's report, then run the process.
